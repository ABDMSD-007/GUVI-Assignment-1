spring.application.name=EmiProject

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nacl}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:3600000}

# Loan eligibility threshold
app.loan.credit-score-threshold=700

# Data seeding (Java DataSeeder). Set to true for a single run to insert
# the admin/manager/users + sample loans, then set back to false.
app.seed.enabled=false

# CORS - front-end origins allowed to call this API (comma-separated).
# Angular dev server (ng serve) runs on 4200; SSR/express on 4000.
app.cors.allowed-origins=http://localhost:4200,http://localhost:4000

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Logging
logging.level.root=INFO
logging.level.com.example.demo=DEBUG
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/emi-application.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7


