spring.application.name=EmiProject-test

# In-memory H2 (PostgreSQL compatibility mode) for integration tests
spring.datasource.url=jdbc:h2:mem:emitest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JWT (test values)
app.jwt.secret=test-super-secret-key-that-is-at-least-32-characters-long!
app.jwt.expiration=3600000

# Loan eligibility threshold
app.loan.credit-score-threshold=700

# Quieter logs during tests
logging.level.com.example.demo=INFO
logging.level.org.springframework.security=WARN
logging.file.name=

